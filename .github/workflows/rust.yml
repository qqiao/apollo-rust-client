name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and WASM target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Native clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rustls clippy
        run: cargo clippy --no-default-features --features rustls --all-targets -- -D warnings
      - name: WASM clippy
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Documentation tests
        run: cargo test --doc

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update Rust toolchain and install WASM target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build and verify exported package
        run: scripts/build.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update Rust toolchain and install WASM target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Tool and runtime preflight
        run: |
          docker --version
          docker compose version
          node --version
          cargo --version
          wasm-pack --version
      - name: Run test suite
        run: scripts/test.sh
      - name: Fallback Docker Compose teardown
        if: always()
        run: |
          scripts/apollo-test.sh cleanup || true
      - name: Upload test diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-test-diagnostics
          path: |
            target/apollo-test-latest/logs/
            target/apollo-test-latest/ownership.json
            target/apollo-test-latest/state.json
            target/apollo-test-latest/state-second.json
          if-no-files-found: ignore
